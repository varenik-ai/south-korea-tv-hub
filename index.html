<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="referrer" content="no-referrer">
  <title>Korea TV Live</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { background:#0a0a14; height:100%; font-family:-apple-system,BlinkMacSystemFont,sans-serif; color:white; overflow:hidden; touch-action:pan-x pan-y pinch-zoom; }

    /* ── Hub ── */
    #hub-screen { display:flex; flex-direction:column; align-items:center; height:100%; overflow-y:auto; padding:24px 16px 40px; padding-top:calc(24px + max(var(--tg-safe-top,0px), env(safe-area-inset-top,0px))); }
    .hub-logo { font-size:26px; font-weight:900; letter-spacing:2px; margin-bottom:4px; text-transform:uppercase; }
    .hub-logo .red   { color:#CD2E3A; }
    .hub-logo .white { color:white; }
    .hub-logo .blue  { color:#0047A0; }
    .thank-btn { margin:22px 0 4px; padding:12px 22px; border-radius:999px; border:1px solid #3a3a2a; background:#1f1d12; color:#ffd54a; font-size:14px; font-weight:700; cursor:pointer; }
    .thank-btn:active { transform:scale(.96); }
    #donate-modal { position:fixed; inset:0; z-index:10000; background:rgba(0,0,0,.7); display:none; align-items:flex-end; justify-content:center; }
    #donate-modal .sheet { width:100%; max-width:560px; background:#14141f; border-radius:18px 18px 0 0; padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px)); text-align:center; }
    #donate-modal h3 { font-size:17px; margin-bottom:14px; }
    #donate-modal .amounts { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
    #donate-modal .amounts button { padding:14px 0; border-radius:12px; border:1px solid #3a3a2a; background:#1f1d12; color:#ffd54a; font-size:15px; font-weight:800; cursor:pointer; }
    #donate-modal .close { margin-top:12px; background:none; border:none; color:#666; font-size:14px; cursor:pointer; }
    .hub-sub { font-size:13px; color:#555; margin-bottom:24px; }
    .footer-note { font-size:11px; color:#444; text-align:center; margin-top:16px; line-height:1.6; max-width:480px; }
    .channels-grid { width:100%; max-width:560px; display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }

    .category-header { grid-column:1/-1; font-size:11px; font-weight:700; color:#444; text-transform:uppercase; letter-spacing:2px; padding:6px 4px 2px; margin-top:6px; }

    .channel-card { background:#1a1a28; border:1px solid #2a2a3a; border-radius:14px; padding:12px 14px; display:flex; align-items:center; gap:10px; cursor:pointer; transition:all .2s; position:relative; overflow:hidden; min-width:0; }
    .channel-card::before { content:''; position:absolute; left:0; top:0; bottom:0; width:4px; border-radius:4px 0 0 4px; background:var(--ch-color,#555); }
    .channel-card:active { opacity:.75; transform:scale(.98); }
    .ch-icon { width:44px; height:44px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:900; flex-shrink:0; }
    .ch-icon.ch-logo { background:#fff !important; padding:6px; box-sizing:border-box; }   /* korea-tv: светлая плашка — многие корейские логотипы тёмные */
    .ch-icon.ch-logo img { width:100%; height:100%; object-fit:contain; display:block; }
    .site-link-btn { background:linear-gradient(135deg,#ff9800,#f4511e) !important; font-weight:800 !important; box-shadow:0 2px 10px rgba(244,81,53,.5); }
    .ch-info { flex:1; min-width:0; }
    .ch-name { font-size:14px; font-weight:700; white-space:normal; line-height:1.25; }
    .live-dot { width:8px; height:8px; background:var(--ch-color,#555); border-radius:50%; animation:pulse 1.2s infinite; flex-shrink:0; }

    /* ── Player ── */
    #player-screen { display:none; flex-direction:column; align-items:center; height:100%; }
    .player-header { width:100%; display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; overflow:hidden;
      padding-top:calc(10px + max(var(--tg-safe-top,0px), env(safe-area-inset-top,0px)));
      padding-right:calc(14px + var(--tg-safe-right,0px));
      padding-bottom:10px;
      padding-left:calc(14px + var(--tg-safe-left,0px));
      background:#0d0d1a; border-bottom:1px solid #1e1e2e; flex-shrink:0; }
    .ch-title-bar { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    /* Кнопка "← Каналы" переехала в нижнюю панель управления (.controls) —
       в верхней шапке она перекрывалась плавающей кнопкой "Закрыть" от Telegram
       в полноэкранном режиме на iOS (та кнопка рисуется поверх контента и может
       быть шире/у́же в зависимости от языка и устройства, надёжно её не обойти). */
    .btn.channels-btn { background:linear-gradient(135deg,#1565c0,#0d47a1); font-weight:700; order:-1; }
    .ch-title-bar { font-size:15px; font-weight:700; }
    .live-badge-top { color:#fff; font-size:10px; font-weight:700; padding:2px 6px; border-radius:4px; margin-left:6px; display:none; }

    /* ── Video ── */
    #video-container { width:100%; flex:1; background:#000; position:relative; overflow:visible; touch-action:pinch-zoom; }
    #video-container.css-fs { position:fixed !important; inset:0 !important; width:100vw !important; height:100vh !important; z-index:9999 !important; }
    #video-container.css-fs .live-badge,
    #video-container:fullscreen .live-badge,
    #video-container:-webkit-full-screen .live-badge { display:none !important; }
    #video-container.css-fs .overlay { display:none !important; }
    #video-container:fullscreen .overlay,
    #video-container:-webkit-full-screen .overlay { display:none !important; }
    video { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; z-index:1; }
    audio { display:none; }

    .live-badge { position:absolute; top:14px; left:14px; color:white; font-size:13px; padding:5px 12px; border-radius:30px; display:none; align-items:center; gap:6px; font-weight:700; z-index:25; background:rgba(205,46,58,.9); }
    #audio-badge { position:absolute; inset:0; display:none; align-items:center; justify-content:center; z-index:3; pointer-events:none; background:rgba(0,0,0,.85); }
    #audio-badge .pill { padding:14px 20px; border-radius:999px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); font-size:15px; }
    body.audio-only #audio-badge { display:flex; }
    body.audio-only video { opacity:.02; }

    .overlay { position:absolute; inset:0; z-index:20; pointer-events:none; transition:opacity .5s ease; }
    .overlay.hidden { opacity:0; pointer-events:none; }
    .controls { position:absolute; bottom:0; left:0; right:0; background:linear-gradient(transparent,rgba(0,0,0,.92)); padding:28px 14px; pointer-events:all; display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
    .btn { padding:12px 18px; color:white; border:none; border-radius:10px; font-size:14px; cursor:pointer; transition:all .2s; flex:1; max-width:160px; background:rgba(255,255,255,.12); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,.1); }
    .btn:active { transform:scale(.96); }
    .btn.danger { background:#CD2E3A; }
    .btn.air-next { flex:1 0 100%; max-width:none; background:#CD2E3A; font-weight:600; }
    .btn.reload { background:#333; }

    #status { font-size:13px; color:#888; text-align:center; padding:8px 0 0; flex-shrink:0; }
    .dot { display:inline-block; width:8px; height:8px; background:#CD2E3A; border-radius:50%; margin-right:6px; animation:pulse 1.2s infinite; vertical-align:middle; }
    @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.25} }
  </style>
</head>
<body>

<div id="hub-screen">
  <div class="hub-logo"><span class="red">한</span><span class="blue">국</span> <span class="white">TV</span></div>
  <div class="hub-sub" id="hub-sub"></div>

<div id="donate-modal"><div class="sheet">

</div></div>

<div id="player-screen">

    <video id="video" autoplay playsinline webkit-playsinline airplay="allow" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:1;"></video>
    <div class="overlay" id="overlay">
      <div class="controls">
        <button id="back-btn" class="btn channels-btn"></button>
        <button id="reload-btn" class="btn reload" style="display:none"></button>

        <button id="thank-btn-player" class="btn"></button>

      </div>

    <audio id="audio-bg" muted></audio>
  </div>
  <div id="status">...</div>

<script>
const tg = window.Telegram?.WebApp;

// ── Safe area ──────────────────────────────────────────────────────────────
function updateSafeArea() {
  const inFs = document.fullscreenElement || tg?.isFullscreen;
  const csa = tg?.contentSafeAreaInsets || {};
  const sa  = tg?.safeAreaInsets || {};
  // В полноэкранном режиме Telegram рисует свою плавающую кнопку "Закрыть"
  // поверх контента (не резервируя место через layout) — если сам Telegram
  // не прислал реальные contentSafeAreaInsets, подстраховываемся своими
  // отступами, чтобы наша кнопка "← Каналы" не оказалась под ней.
  const topReal   = csa.top    || sa.top    || 0;
  const leftReal  = csa.left   || sa.left   || 0;
  const rightReal = csa.right  || sa.right  || 0;
  // По скриншоту с iPhone: капсула "✕ Закрыть" слева доходит примерно до 25%
  // ширины экрана, а шеврон+меню "···" справа занимают примерно 20% ширины —
  // старых 54px хватало не всегда, увеличили запас с обеих сторон.
  const top   = topReal   > 0 ? topReal   : (inFs ? 56  : 0);
  const left  = leftReal  > 0 ? leftReal  : (inFs ? 104 : 0);
  const right = rightReal > 0 ? rightReal : (inFs ? 88  : 0);
  document.documentElement.style.setProperty('--tg-safe-top', top + 'px');
  document.documentElement.style.setProperty('--tg-safe-left', left + 'px');
  document.documentElement.style.setProperty('--tg-safe-right', right + 'px');
}
if (tg) {
  tg.ready(); tg.expand();
  try { tg.disableVerticalSwipes(); } catch(e) {}
  try { tg.setHeaderColor('#000000'); } catch(e) {}
  try { tg.setBackgroundColor('#000000'); } catch(e) {}
  if (isAndroid() || isIOS()) setTimeout(() => { try { tg.requestFullscreen(); } catch(e) {} }, 300);
  try { tg.onEvent('safeAreaChanged', updateSafeArea); } catch(e) {}
  try { tg.onEvent('contentSafeAreaChanged', updateSafeArea); } catch(e) {}
  setTimeout(updateSafeArea, 500);
}

// ── Определение платформы ──────────────────────────────────────────────────
function isIOS() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent)
    || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)
    || window.Telegram?.WebApp?.platform === 'ios';
}
function isAndroid() { return /Android/i.test(navigator.userAgent); }

// ── Каналы ────────────────────────────────────────────────────────────────
const PROXY = 'https://korea-worker.dyaltd.workers.dev';

// v82.14: ротация резервных прокси — на сайте (russian-tv.com) это уже есть
// и решает как раз ту разницу в надёжности "на сайте работает, в мини-аппе
// нет": при сбое основного Worker'а (rate limit, временный сетевой сбой,
// краевой узел Cloudflare и т.п.) плеер сайта автоматически переключается
// на резервный, а мини-апп раньше был жёстко привязан к одному URL без
// какого-либо резерва. Список тот же, что на сайте (/proxy.json).
// v82.27: пользователь сообщил, что Первый канал заводится только после
// двух переключений (т.е. первые 2 прокси в списке не срабатывают с
// первой попытки, а третий — стабильно). Переставил birch-creek первым.
// v82.36: основной воркер первым, как на сайте (старая перестановка birch-creek под Первый канал устарела).
// Korea: один воркер (korea-worker, гибридный режим v1.6.0). Механизм ротации оставлен как в эталоне — с одним адресом он просто повторяет его.
var PROXIES = ['https://korea-worker.dyaltd.workers.dev'];
var _proxyIdx = 0;
var _proxyFailedAt = {};
function _currentProxy() { return PROXIES[_proxyIdx % PROXIES.length]; }
function _markProxyFailed() { _proxyFailedAt[_proxyIdx % PROXIES.length] = Date.now(); }
function _advanceProxy() {
  for (var i = 1; i <= PROXIES.length; i++) {
    var idx = (_proxyIdx + i) % PROXIES.length;
    var failedAt = _proxyFailedAt[idx];
    if (!failedAt || Date.now() - failedAt > 90000) { _proxyIdx += i; return; }
  }
  _proxyIdx++;
}
function _streamUrl(ch) { return _currentProxy() + '/stream?channel=' + ch.id; }

// v82.15: логотипы — 1-в-1 как на сайте (russian-tv.com): там, где у сайта

// цветная текстовая плашка, поэтому здесь она и остаётся (это не расхождение
// с сайтом, а тот же самый fallback). `slug` — путь канала на russian-tv.com
// для кнопки "Смотреть на сайте".

      { id:'ebs_plus1',   name:'EBS Plus 1',   desc:'EBS플러스1',  icon:'E+1',color:'#00695c', iconBg:'#061212', logo:SITE+'/assets/logos/ebs-plus1.png', slug:'ebs-plus1-live', stream: PROXY+'/stream?channel=ebs_plus1' },

      }
      if (data.type===Hls.ErrorTypes.MEDIA_ERROR)   { try{hls.recoverMediaError();}catch(err){} return; }
      _markProxyFailed(); _advanceProxy();
      setStatus('errorStream', true); _scheduleInit(3000);
    });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    // Нативный путь (Safari/iOS — hls.js сам уступает браузеру со встроенной
    // поддержкой HLS). ВАЖНО (v82.12): раньше здесь не было НИКАКОЙ обработки
    // ошибок — если поток не грузился (а у части источников бывают разовые
    // сбои на первой попытке: свежий сегмент ещё не записан, редирект,
    // нестрогое соответствие плейлиста спеке — AVPlayer к этому строже, чем
    // hls.js), статус навсегда зависал на "Подключение..." без единой
    // попытки переподключиться. Именно это, похоже, и объясняло "большинство
    // каналов не играет" именно на iPhone — на десктопе тот же код идёт
    // через hls.js веткой выше, у которой ретраи есть. Добавлены: обработчик
    // 'error' на видео + watchdog по таймауту, если воспроизведение не
    // началось за разумное время.
    // v82.13: v82.12 добавил сюда addEventListener('error', ..., {once:true}),
    // но если канал стартовал успешно (сработал 'loadedmetadata'), сам
    // обработчик error НИКОГДА не срабатывал и НИКОГДА не снимался — оставался
    // висеть на общем `video`-элементе навсегда. При каждом переключении
    // канала stopStream() делает video.src='', что само по себе генерирует
    // событие 'error' — и ВСЕ накопленные с прошлых каналов обработчики
    // срабатывали одновременно при следующем же переключении, наперебой
    // вызывая init() и ломая последующую загрузку. Чем больше каналов
    // переключили — тем хуже. Теперь обработчики именованные и снимаются
    // явно в обеих ветках (успех/ошибка), плюс на каждый заход в
    // native-ветку сперва снимаются обработчики от предыдущего захода.
    if (_nativeErrorHandler) { video.removeEventListener('error', _nativeErrorHandler); _nativeErrorHandler = null; }
    if (_nativeMetaHandler) { video.removeEventListener('loadedmetadata', _nativeMetaHandler); _nativeMetaHandler = null; }
    let nativeStarted = false;
    const nativeTimeout = setTimeout(() => {
      // v82.14: тоже переключаем прокси перед повтором — раньше повторяли
      // тот же самый URL, что бессмысленно, если сломан именно прокси.
      if (!nativeStarted && currentCh) { _markProxyFailed(); _advanceProxy(); setStatus('errorStream', true); _scheduleInit(2000); }
    }, 25000);
    _nativeErrorHandler = () => {
      clearTimeout(nativeTimeout);
      video.removeEventListener('loadedmetadata', _nativeMetaHandler); _nativeMetaHandler = null;
      _nativeErrorHandler = null;
      if (currentCh) { _markProxyFailed(); _advanceProxy(); setStatus('errorStream', true); _scheduleInit(3000); }
    };
    _nativeMetaHandler = () => {
      nativeStarted = true; clearTimeout(nativeTimeout);
      video.removeEventListener('error', _nativeErrorHandler); _nativeErrorHandler = null;
      _nativeMetaHandler = null;
    };
    video.addEventListener('error', _nativeErrorHandler, { once: true });
    video.addEventListener('loadedmetadata', _nativeMetaHandler, { once: true });
    // v82.33: в этой (нативной, AVPlayer/iOS) ветке video.muted НИКОГДА не
    // выставлялся перед play() — в отличие от hls.js-ветки выше. Автовоспроиз-
    // ведение СО ЗВУКОМ без предшествующего жеста пользователя браузер/AVPlayer
    // блокирует — именно из-за этого play() здесь стабильно отклонялся и статус
    // упирался в "Нажмите ▶" без связи с конкретным источником/каналом.
    if (!userUnmuted) video.muted = true;
    const _nUrl = streamUrl;
    const _pin = _nUrl;
    video.src=_pin; try { initQualityNative(_nUrl); } catch (e) {} setStatus('connecting'); liveBadge.style.display='flex'; liveBadgeTop.style.display='inline';
    video.play()
      .then(() => {
        nativeStarted = true; clearTimeout(nativeTimeout);
        video.removeEventListener('error', _nativeErrorHandler); _nativeErrorHandler = null;
        setStatus('live'); unmuteBtn.style.display=audioOnly?'none':'block'; _restoreSound(); setupMediaSession(); if(!isIOS())requestWakeLock();
      })
      .catch((err) => {
        // v82.46: меню качества сразу после старта подменяет video.src → первый play() получает AbortError («прервано новой загрузкой»).
        // Это не сбой источника: раньше из-за него дважды писало «Ошибка — переподключаемся» и перезапускало канал по кругу.
        if (err && err.name === 'AbortError') {
          video.addEventListener('playing', () => { clearTimeout(nativeTimeout); nativeStarted = true; _nativePlayRetryCount = 0; setStatus('live'); unmuteBtn.style.display = audioOnly ? 'none' : 'block'; _restoreSound(); try { setupMediaSession(); } catch (e) {} }, { once: true });
          return;
        }
        // v82.34: раньше ЛЮБОЙ отказ play() (даже из-за разового сетевого
        // сбоя/битого первого сегмента у источника — "AVPlayer строже, чем
        // hls.js", см. комментарий выше) сразу и окончательно показывал
        // "Нажмите ▶", без единой попытки автоматически восстановиться —
        // в отличие от обработчика 'error' у этой же ветки, который ретраит.
        // Раз видео теперь всегда замьючено (v82.33), NotAllowedError
        // (настоящая блокировка автоплея) практически невозможен — почти
        // любой отказ здесь на деле сетевой/декодерный. Пробуем автоматически
        // переключить прокси и повторить (как watchdog), и только после
        // нескольких неудач подряд отдаём управление пользователю.
        clearTimeout(nativeTimeout);
        _nativePlayRetryCount++;
        if (_nativePlayRetryCount <= 2 && currentCh) {
          _markProxyFailed(); _advanceProxy();
          setStatus('errorStream', true);
          _scheduleInit(1500);
        } else {
          setStatus('pressPlay', true);
        }
      });
  }

  // v82.40: авторефреш каждые 20 минут убран — воркер всегда отдаёт m3u8, hls.js обновляет плейлист сам, а лишний запрос только нагружал воркеры.
}

async function init() {
  if (!currentCh) return;
  setStatus('loading'); reloadBtn.style.display='none'; unmuteBtn.style.display='none';
  try {
    // v82.35: раньше здесь был ручной fetch() плейлиста только чтобы
    // проверить Content-Type — а затем hls.js/нативный плеер тут же ЗАНОВО
    // фетчил тот же самый URL сам. То есть КАЖДОЕ открытие канала и КАЖДЫЙ
    // реконнект стоили 2 запроса к Worker вместо одного. Проверка Content-
    // Type была нужна для старой ветки "Worker вернул JSON с .url" — при
    // текущей архитектуре Worker при успехе ВСЕГДА отдаёт m3u8 напрямую
    // (JSON — только при ошибках, которые и так ловятся через .catch ниже
    // и обработчики ошибок hls.js/видео), так что эта ветка давно мертва.
    // Убрали лишний fetch — при том же трафике зрителей нагрузка на Worker
    // от плейлистов падает примерно вдвое.
    const streamUrl = _streamUrl(currentCh);
    loadStream(streamUrl);
  } catch(e) {
    // v82.14: сбой текущего прокси (сеть/HTTP-ошибка) — переключаемся на
    // резервный и пробуем ещё раз, прежде чем показывать ошибку зрителю.
    // v82.30: БЫЛО 3000мс задержки перед повтором. У cinerama.uz-каналов
    // блокировка датацентрового IP часто временная и снимается сама за
    // секунду-две (see fetchCinerama на Worker'е) — три секунды ожидания на
    // КАЖДУЮ попытку создавали ощущение "долго не заводится", хотя по сути
    // достаточно было просто быстрее повторить запрос. СТАЛО 1000мс.
    _markProxyFailed(); _advanceProxy();
    setStatus('errorServer', true);
    try { statusEl.innerHTML += ' <small>[' + ((e && (e.name + ': ' + e.message)) || e) + ']</small>'; } catch (x) {}   // диагностика: показать причину
    _scheduleInit(1000);
  }
}

// ── Кнопки ─────────────────────────────────────────────────────────────────
reloadBtn.onclick = () => { userPaused=false; _resetRetry(); init(); };
// v82.32: статус "Нажмите ▶" (video.play() отклонён браузером/AVPlayer —
// чаще всего это autoplay-политика) раньше не давал НИКАКОЙ возможности
// возобновить воспроизведение: кнопка "Переподключиться" показывалась
// только при isError=true, а setStatus('pressPlay') вызывался БЕЗ этого
// флага — пользователь упирался в текст без единого рабочего элемента.
// Плюс клик по самому видео — самый естественный жест "нажмите ▶".
video.addEventListener('click', () => {
  if (video.paused) video.play().catch(() => {});
});
unmuteBtn.onclick = () => {
  const ab = document.getElementById('audio-bg');
  if (video.muted) {
    video.muted=false; video.volume=1; userUnmuted=true; _soundWanted=true;
    unmuteBtn.textContent = '🔇 '+t.mute;
    if (ab) { ab.muted=true; ab.pause(); }
  } else {
    video.muted=true; userUnmuted=false; _soundWanted=false;
    unmuteBtn.textContent = '🔊 '+t.unmute;
    if (ab && isIOS()) { ab.muted=false; ab.volume=0; ab.play().catch(()=>{}); }
  }
};
modeBtn.onclick = () => setAudioMode(!audioOnly);

// ── Хаб ───────────────────────────────────────────────────────────────────
function buildHub() {
  channelsGrid.innerHTML = '';
  CHANNEL_GROUPS.forEach(group => {
    const header = document.createElement('div');
    header.className = 'category-header';
    header.textContent = group.label;
    channelsGrid.appendChild(header);

    group.channels.forEach(ch => {
      const card = document.createElement('div');
      card.className = 'channel-card';
      card.style.setProperty('--ch-color', ch.color);
      const iconHtml = ch.logo
        ? `<div class="ch-icon ch-logo"><img src="${ch.logo}" alt="${ch.icon}" loading="lazy" onerror="this.parentElement.outerHTML='&lt;div class=&quot;ch-icon&quot; style=&quot;background:${ch.iconBg};color:${ch.color}&quot;&gt;${ch.icon}&lt;/div&gt;'"></div>`
        : `<div class="ch-icon" style="background:${ch.iconBg};color:${ch.color}">${ch.icon}</div>`;
      card.innerHTML = `
        ${iconHtml}
        <div class="ch-info">
          <div class="ch-name">${ch.name}</div>
        </div>
        <div class="live-dot"></div>`;
      card.onclick = () => openChannel(ch);
      channelsGrid.appendChild(card);
    });
  });
}

function openChannel(ch) {
  currentCh = ch; _soundWanted = false; _resetRetry();
  hubScreen.style.display = 'none';
  playerScreen.style.display = 'flex';
  chTitle.textContent = ch.name;
  liveBadgeTop.style.background = ch.color;
  liveBadge.style.background = ch.color;
  audioOnly = false; document.body.classList.remove('audio-only');
  modeBtn.textContent = t.audioMode;
  _watchdogReconnectCount = 0; // v82.14: новый канал — начинаем счёт сбоев прокси заново
  _nativePlayRetryCount = 0; // v82.34: новый канал — счёт неудачных play() в нативной ветке заново

  video.style.display = '';
  statusEl.style.display = '';
  modeBtn.style.display = '';
  fullscreenBtn.style.display = '';
  siteLinkBtn.style.display = '';
  stopStream();
  init();
}

function goToHub() {
  stopStream();
  playerScreen.style.display = 'none';
  hubScreen.style.display = 'flex';
  currentCh = null;
}

backBtn.onclick = () => goToHub();

buildHub();
// ── Благодарность через Telegram Stars (⭐): окно выбора суммы, оплата tg.openInvoice (v82.44) ──
const BOT_API = 'https://korea-bot-worker.dyaltd.workers.dev';
const THANK = { ko:'⭐ 감사하기', en:'⭐ Say thanks' };
const thankText = THANK[getLang()] || THANK.en;
const donateModal = document.getElementById('donate-modal');
function openDonate() {
  document.getElementById('donate-title').textContent = thankText;
  const box = document.getElementById('donate-amounts'); box.innerHTML = '';
  [25, 50, 100, 250].forEach(n => {
    const b = document.createElement('button'); b.textContent = '⭐ ' + n;
    b.onclick = () => payStars(n); box.appendChild(b);
  });
  donateModal.style.display = 'flex';
}
async function payStars(amount) {
  try {
    const r = await fetch(BOT_API + '/invoice?amount=' + amount);
    const d = await r.json();
    if (!d.url || !tg?.openInvoice) return;
    donateModal.style.display = 'none';
    tg.openInvoice(d.url);
  } catch (e) {}
}
document.getElementById('donate-close').onclick = () => { donateModal.style.display = 'none'; };
donateModal.addEventListener('click', e => { if (e.target === donateModal) donateModal.style.display = 'none'; });
['thank-btn-hub', 'thank-btn-player'].forEach(id => {
  const el = document.getElementById(id); el.textContent = thankText; el.onclick = openDonate;
});

// v82.43/44: t.me/KoreaTVHub_bot/koreatv?startapp=<id канала> (например ebs1) открывает мини-апп сразу на этом канале, startapp=donate — окно ⭐
// В Telegram location.hash непустой (#tgWebAppData=...), поэтому параметр запуска берём из initDataUnsafe, tgWebAppStartParam или простого #id
try {
  const hp = new URLSearchParams((location.hash || '').replace('#', ''));
  const hashId = (location.hash || '').indexOf('=') < 0 ? (location.hash || '').replace('#', '') : '';
  const sp = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || hp.get('tgWebAppStartParam') || hashId || '';
  if (sp === 'donate') openDonate();
  else if (sp) { const chx = CHANNEL_GROUPS.flatMap(g => g.channels).find(c => c.id === sp); if (chx) openChannel(chx); }
} catch (e) {}
</script>
